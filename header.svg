<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Davide Bolzoni — software engineer</title>
  <desc id="desc">A dark editorial profile banner with a gold orbital mark and the text Davide Bolzoni.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0E"/>
      <stop offset="0.55" stop-color="#151518"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2DF8B"/>
      <stop offset="0.48" stop-color="#DBBD59"/>
      <stop offset="1" stop-color="#9C7B28"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#DBBD59" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#DBBD59" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#DBBD59" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="small-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="1010" cy="184" r="155" fill="url(#halo)" filter="url(#blur)"/>
  <circle cx="1010" cy="184" r="104" fill="#DBBD59" opacity="0.08" filter="url(#small-blur)"/>

  <rect x="28" y="28" width="1144" height="304" rx="22" fill="none" stroke="url(#gold)" stroke-opacity="0.72"/>
  <path d="M58 292H520" stroke="url(#gold)" stroke-width="2"/>
  <path d="M58 299H282" stroke="#FFFFFF" stroke-opacity="0.22"/>

  <g fill="#DBBD59">
    <rect x="58" y="58" width="8" height="8" rx="2"/>
    <rect x="74" y="58" width="8" height="8" rx="2" opacity="0.55"/>
    <rect x="90" y="58" width="8" height="8" rx="2" opacity="0.28"/>
  </g>

  <text x="116" y="66" fill="#B7B0A1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="3">// PROFILE.README</text>
  <text x="58" y="178" fill="#F8F4E8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="68" font-weight="700" letter-spacing="7">DAVIDE</text>
  <text x="58" y="246" fill="url(#gold)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="68" font-weight="700" letter-spacing="7">BOLZONI</text>
  <text x="58" y="320" fill="#A8A297" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="2">SOFTWARE ENGINEER · SATISPAY · ITALY</text>

  <g transform="translate(1010 184)">
    <circle r="90" fill="none" stroke="#DBBD59" stroke-opacity="0.17"/>
    <ellipse rx="92" ry="28" fill="none" stroke="url(#gold)" stroke-width="2" transform="rotate(-22)"/>
    <ellipse rx="92" ry="28" fill="none" stroke="#F2DF8B" stroke-opacity="0.46" stroke-width="1" transform="rotate(48)"/>
    <circle r="42" fill="#DBBD59" opacity="0.14"/>
    <circle r="31" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle r="6" fill="#F2DF8B"/>
    <circle cx="72" cy="-38" r="4" fill="#DBBD59"/>
    <circle cx="-64" cy="48" r="3" fill="#DBBD59" opacity="0.7"/>
    <text x="-31" y="5" fill="#F8F4E8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="1">DBBD59</text>
    <text x="-24" y="24" fill="#B7B0A1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="2">HEX / JOKE</text>
  </g>
</svg>
